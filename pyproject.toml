[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gfp-cli"
version = "0.1.0"
description = "A modular, extensible Git-compatible CLI layer and command wrapper for Perforce Helix Core (p4)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "eidotal" },
]
keywords = ["perforce", "p4", "git", "cli", "helix-core", "vcs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[project.scripts]
gfp = "gfp:main"

[project.urls]
Homepage = "https://github.com/eidotal/gfp-cli"
Repository = "https://github.com/eidotal/gfp-cli"
Issues = "https://github.com/eidotal/gfp-cli/issues"

[tool.setuptools]
py-modules = ["gfp", "utils"]
packages = ["commands"]

[tool.ruff]
target-version = "py310"
line-length = 140
exclude = [
    "output",
    "docker",
    ".venv",
    ".cache",
    ".gfp",
]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E402",    # module level import not at top of file (test path setup)
    "E501",    # line-too-long (handled by formatter)
    "EXE001",  # shebang on non-executable files
    "RUF012",  # mutable class default on dataclasses
    "PLW1510", # subprocess.run without check
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
cache_dir = ".cache/mypy"

# Diagnostic clarity
show_error_codes = true
show_column_numbers = true
pretty = true

# Safety checks
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = false

# Gradual typing posture
strict = false
disallow_untyped_defs = false
check_untyped_defs = true

# Module resolution
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

# Explicit exclusions
exclude = [
    "^output/",
    "^docker/",
    "^\\.venv/",
    "^\\.cache/",
    "^\\.gfp/",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    "docker",
    "output",
    ".venv",
    ".cache",
    ".gfp",
]
